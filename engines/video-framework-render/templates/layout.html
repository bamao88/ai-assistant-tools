<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:720px; height:1280px; }
  .stage { position:relative; width:720px; height:1280px; overflow:hidden; background:#000; }

  /* 模糊填充背景（B模式启用） */
  .blurbg {
    position:absolute; inset:0; width:720px; height:1280px;
    object-fit:cover; filter:blur(24px) brightness(0.62); transform:scale(1.12);
    display:none;
  }
  body.blur .blurbg { display:block; }

  /* 横屏视频条：1920x1080 -> 720x405，垂直居中 */
  .video {
    position:absolute; top:268px; left:0; width:720px; height:744px;
    object-fit:cover; object-position:64.5% 50%;
  }

  /* 顶部/底部压暗（仅 B 模式需要，A 模式本就是黑） */
  .top-scrim, .bot-scrim { position:absolute; left:0; width:720px; display:none; }
  body.blur .top-scrim, body.blur .bot-scrim { display:block; }
  .top-scrim { top:0; height:438px; background:linear-gradient(180deg,rgba(0,0,0,0.78),rgba(0,0,0,0.32) 70%,rgba(0,0,0,0.12)); }
  .bot-scrim { bottom:0; height:438px; background:linear-gradient(0deg,rgba(0,0,0,0.82),rgba(0,0,0,0.3) 70%,rgba(0,0,0,0.1)); }

  /* 标题 */
  .title {
    position:absolute; top:74px; left:56px; width:608px; text-align:center; color:#fff;
    font-family:"Songti SC","STSong",Georgia,serif; text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }
  .title .en { font-size:38px; font-weight:700; letter-spacing:0.5px; line-height:1.18; }
  .title .cn { font-size:46px; font-weight:700; letter-spacing:1px; line-height:1.3; margin-top:4px; }
  .accent { position:absolute; top:228px; left:50%; transform:translateX(-50%);
            width:72px; height:4px; border-radius:2px; background:#FF6B5C; }

  /* 字幕 */
  .caption-wrap { position:absolute; left:0; top:1044px; width:720px; display:flex; justify-content:center; }
  .caption {
    display:inline-block; max-width:632px;
    color:#fff; font-family:"PingFang SC","STHeiti",sans-serif;
    font-size:40px; font-weight:600; letter-spacing:1px; line-height:1.2;
    white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,0.85);
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="blurbg" src="zh_raw.png">
    <div class="top-scrim"></div>
    <div class="bot-scrim"></div>
    <img class="video" src="zh_raw.png">
    <div class="title">
      <div class="en">Agentic Engineering</div>
      <div class="cn">第一课：少控制，多验收</div>
    </div>
    <div class="accent"></div>
    <div class="caption-wrap"><div class="caption">也不需要你去优化</div></div>
  </div>
  <script>
    if (location.search.includes('blur')) document.body.classList.add('blur');
  </script>
</body>
</html>
