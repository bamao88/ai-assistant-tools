[project]
name = "video-research"
version = "0.1.0"
description = "视频素材研究工具：字幕/转写 + 关键帧 + 元数据，供内容写作参考"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2026.3.17",
    "curl-cffi>=0.10,<0.15",
    "faster-whisper>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
