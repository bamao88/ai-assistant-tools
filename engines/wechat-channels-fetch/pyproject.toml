[project]
name = "wechat-channels-fetch"
version = "0.1.0"
description = "Wechat Channels account/feed fetcher for AI_Assistant tools"
requires-python = ">=3.11,<3.13"
dependencies = [
    "patchright==1.58.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
