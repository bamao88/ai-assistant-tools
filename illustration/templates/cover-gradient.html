<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 封面 · 明亮渐变(玻璃拟态)。渲染尺寸固定，勿改。 -->
<meta name="render-size" content="1600x900">
<style>
  /* ===== 调色板：想换渐变配色改 --g1~--g4；强调色改 --pop ===== */
  :root{ --g1:#6366f1; --g2:#8b5cf6; --g3:#d946ef; --g4:#f472b6; --pop:#fde68a; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1600px; height:900px; }
  body{ font-family:"PingFang SC","Helvetica Neue",sans-serif;
    background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 38%,var(--g3) 72%,var(--g4) 100%);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter:blur(8px); opacity:.5; }
  .b1{ width:520px;height:520px; top:-160px; right:-120px; background:radial-gradient(circle,#fde68a,transparent 70%); }
  .b2{ width:460px;height:460px; bottom:-180px; left:-120px; background:radial-gradient(circle,#67e8f9,transparent 70%); }
  .card{ position:relative; width:1320px; padding:90px 96px;
    background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.35);
    border-radius:48px; backdrop-filter:blur(26px); box-shadow:0 40px 120px rgba(49,10,90,0.35); }
  .kicker{ display:inline-block; font-size:24px; font-weight:700; letter-spacing:4px; color:#fff;
    padding:12px 26px; border-radius:999px; background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.4); margin-bottom:42px; }
  h1{ font-size:104px; line-height:1.2; font-weight:800; color:#fff; letter-spacing:-1px;
    text-shadow:0 4px 30px rgba(60,10,90,0.3); }
  h1 em{ font-style:normal; color:var(--pop); }
  .sub{ margin-top:40px; font-size:33px; color:rgba(255,255,255,0.92); font-weight:500; line-height:1.5; }
  .foot{ margin-top:58px; display:flex; align-items:center; gap:20px; }
  .pill{ font-size:23px; color:#fff; background:rgba(0,0,0,0.18); padding:11px 24px; border-radius:999px; font-weight:600; }
  .by{ margin-left:auto; font-size:25px; color:#fff; font-weight:700; opacity:.95; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="card">
    <!-- EDIT: 顶部小标签（可带 1 个 emoji） -->
    <div class="kicker">🤖 AI 自动化实验</div>
    <!-- EDIT: 主标题，用 <em>…</em> 高亮关键词（会变成强调色） -->
    <h1>当 AI 学会<em>自己打工</em></h1>
    <!-- EDIT: 副标题（可删 <br>） -->
    <div class="sub">我搭了一套多 Agent 内容运营系统：<br>写作、配图、排版、发布，全自动跑起来</div>
    <div class="foot">
      <!-- EDIT: 3-4 个 pill 标签 + 署名 -->
      <span class="pill">多 Agent</span>
      <span class="pill">Claude Code</span>
      <span class="pill">7×24 运行</span>
      <span class="by">@assistant_zh</span>
    </div>
  </div>
</body>
</html>
