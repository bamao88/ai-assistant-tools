# Single source of truth for the shared tools directory.
# Four-tier layout:
#   skills/  - first-party triggerable skills (each a dir with SKILL.md).
#   engines/ - code / CLIs called by skills. NOT triggerable on their own.
#   vendor/  - external clones (own upstream git); some expose a skill.
#   var/     - runtime: state, output, data, logs, drafts, review (gitignored).
#
# Skills are installed into ~/.claude/skills as symlinks (see scripts/sync-skills.py).
# Nothing under skills/ holds heavy code; nothing under engines/ triggers directly.
#
# install_kind:
#   dir  -> symlink ~/.claude/skills/<name> -> <source dir>
#   file -> symlink ~/.claude/skills/<name>/SKILL.md -> <source SKILL.md> (for vendor clones)

skills:
  # --- L1 verb routers (cross-platform entry points) ---
  - name: platform-fetch
    layer: L1
    source: skills/platform-fetch
    install_kind: dir
    purpose: 封闭平台内容抓取统一入口（小红书 / 公众号 / 视频号博主作品列表 / 腾讯会议官方 MCP / 视频字幕封面关键帧）
    uses_engines: [xiaohongshu, gzh-scraper, wechat-channels-fetch, tencent-meeting, video-research]
  - name: platform-publish
    layer: L1
    source: skills/platform-publish
    install_kind: dir
    purpose: 内容发布与多平台分发统一入口（小红书 / 公众号 / 视频号 / B站视频 / 抖音视频 / wechatsync 全平台）
    uses_engines: [xiaohongshu, gzh-publish, tencent-video-publish, markdown-to-cards, platform-draft-direct]
    uses_vendor: [wechatsync, social-auto-upload]

  # --- L2 workflows ---
  - name: blogger-research
    layer: L2
    source: skills/blogger-research
    install_kind: dir
    purpose: 博主调研：批量抓取博主公开内容 + 结构化分析报告
    uses_engines: [xiaohongshu, gzh-scraper, wechat-channels-fetch]
  - name: xhs-ops
    layer: L2
    source: skills/xhs-ops
    install_kind: dir
    purpose: 小红书复合运营工作流（搜索+详情+发布+互动）
    uses_engines: [xiaohongshu]
  - name: video-content
    layer: L2
    source: skills/video-content
    install_kind: dir
    purpose: 视频内容处理（本地/URL 逐字稿、字幕、关键帧、素材研究、标题备选）
    uses_engines: [video-research]
  - name: video-clip
    layer: L2
    source: skills/video-clip
    install_kind: dir
    purpose: 视频剪辑/合成（直接拼接 / 章节进度条成长片 / 片尾钩子卡 / 变速 / 字幕 / 遮名）；复杂框架页切片路由回业务项目
    uses_engines: [video-clip, video-slicer]
  - name: creator-profile
    layer: L2
    source: skills/creator-profile
    install_kind: dir
    purpose: 自媒体人前期对标剖析综合工作流，四大子能力（teardown 博主拆解 / benchmark 博主对比 / niche-mapping 赛道测绘 / hook-decoding 钩子解码），带 fixture 与 checklist。产出止于结构化报告，不做物料包装。
    uses_engines: [xiaohongshu]
  - name: deep-research
    layer: L2
    source: vendor/deep-research/SKILL.md
    install_kind: file
    external: true
    purpose: 多源研究、证据持久化、引用跟踪报告

  # --- atomic / utility ---
  - name: xhs-auth
    layer: atomic
    source: skills/xhs-auth
    install_kind: dir
    purpose: 小红书登录 / 登录态检查 / 多账号管理
    uses_engines: [xiaohongshu]
  - name: xhs-interact
    layer: atomic
    source: skills/xhs-interact
    install_kind: dir
    purpose: 小红书评论 / 回复 / 点赞 / 收藏
    uses_engines: [xiaohongshu]
  - name: markdown-to-cards
    layer: util
    source: skills/markdown-to-cards
    install_kind: dir
    purpose: Markdown 转小红书风格卡片图片
    uses_engines: [markdown-to-cards]
  - name: find-images
    layer: util
    source: skills/find-images
    install_kind: dir
    purpose: 为文章寻找合适配图，支持直接截图和登录墙场景下的网络搜索提取
    uses_engines: [screenshot]
  - name: customer-management
    layer: L2
    source: skills/customer-management
    install_kind: dir
    scope: assistant_zh   # 业务专属：不进全局 ~/.claude/skills；仅 assistant_zh 项目本地双 host 软链
    purpose: 客户/学员资产管理（4 能力 + 任务卡 + 配方）：学员入表 / 就业回访 / 客户资产体检订正 / 好友刷新建行 / 付款 / 客户表同步飞书 / ad-hoc 读聊天检索
    uses_engines: [customer-management]
  - name: zh-video-cover
    layer: L2
    source: skills/zh-video-cover
    install_kind: dir
    scope: assistant_zh   # 业务专属：不进全局 ~/.claude/skills；仅 assistant_zh 项目本地双 host 软链（install-symlinks.sh）
    purpose: 张和口播视频封面生成（evc 宋体渐变，3:4）：kit 驱动单张/批量，底图轮换+相邻不撞。共享底图池/渐变素材在 platform-publish/assets/video-cover/zhanghe（黑块黄字 9:16 那套仍在 platform-publish）
    uses_engines: []
  - name: publish-prep
    layer: L2
    source: skills/publish-prep
    install_kind: dir
    scope: assistant_zh   # 业务专属：不进全局 ~/.claude/skills；仅 assistant_zh 项目本地双 host 软链（install-symlinks.sh）
    purpose: 发布前素材准备（Stage2）：按平台逐 destination 产 publish_<account>.md（标题候选/各平台正文/封面标题文案/摘要/关键词）。规格真源 assets/platform_rules.yaml（主轴=平台+form 副轴），关键词池 assets/keyword_pool.yaml。卡在 ready_to_publish 之后、platform-publish 上传之前
    uses_engines: [publish-prep]
  - name: humanizer
    layer: util
    source: vendor/humanizer/SKILL.md
    install_kind: file
    external: true
    purpose: 去 AI 味写作润色
  - name: dbs
    layer: external
    source: vendor/dbskill/skills/dbs
    install_kind: dir
    external: true
    purpose: dontbesilent 商业工具箱主入口，按意图路由到 dbs-* skills
    uses_vendor: [dbskill]
