# Single source of truth for the shared tools directory.
# Four-tier layout:
#   skills/  - first-party triggerable skills (each a dir with SKILL.md).
#   engines/ - code / CLIs called by skills. NOT triggerable on their own.
#   vendor/  - external clones (own upstream git); some expose a skill.
#   var/     - runtime: state, output, data, logs, drafts, review (gitignored).
#
# Discovery links follow hosts/scope (see scripts/sync-skills.py).
# media_domain groups the Codex media-operations system; project is ownership,
# project_entry preserves an existing local entry independently of global discovery.
# Nothing under skills/ holds heavy code; nothing under engines/ triggers directly.
#
# install_kind:
#   dir  -> symlink ~/.claude/skills/<name> -> <source dir>
#   file -> symlink ~/.claude/skills/<name>/SKILL.md -> <source SKILL.md> (for vendor clones)

skills:
  # --- L1 verb routers (cross-platform entry points) ---
  - name: platform-fetch
    media_domain: materials
    layer: L1
    source: skills/platform-fetch
    install_kind: dir
    hosts: [claude, codex]
    purpose: 封闭平台内容抓取统一入口（小红书 / 公众号 / 视频号博主作品列表 / 腾讯会议官方 MCP / 视频字幕封面关键帧）
    uses_engines: [xiaohongshu, gzh-scraper, wechat-channels-fetch, tencent-meeting, video-research]
  - name: Agent-Publish
    media_domain: distribution
    layer: L1
    source: skills/platform-publish
    install_kind: dir
    hosts: [claude, codex]
    purpose: 本机复用已登录Chrome，三阶段会话hook后逐平台检查、上传或按授权提交；无登录请本人在原页登录，不启用独立配置/远端/凭据直传
    uses_engines: [publish-prep, gzh-publish]
    uses_vendor: []

  # --- L2 workflows ---
  - name: self-media-init
    media_domain: strategy
    layer: L2
    source: skills/self-media-init
    install_kind: dir
    hosts: [claude, codex]
    purpose: 自媒体账号项目初始化与补齐：盘点已有资料、建立定位和资产台账、明确事实源与后续能力入口，交付第一轮内容验证安排；检查模式只读
  - name: content-production-prep
    media_domain: materials
    layer: L2
    source: skills/content-production-prep
    install_kind: dir
    hosts: [claude, codex]
    purpose: 自媒体内容素材包制备工作流：在选题已确定后整理内容 item、锁定口径、归档素材/脚本/转录稿/成片/封面/标题/正文/标签，并在进入剪辑、设计、审核或发布前做状态与素材完整性检查；不直接发布
  - name: content-package-create
    media_domain: distribution
    layer: L2
    source: skills/content-package-create
    install_kind: dir
    hosts: [claude, codex]
    purpose: 标题与平台文案：根据已确定内容制作标题、笔记正文、平台配文、封面文字和完整发布包；完整文章交 source-longform-writing，不进入平台后台
    uses_engines: [publish-prep, markdown-to-cards]
  - name: video-content
    media_domain: materials
    layer: L2
    source: skills/video-content
    install_kind: dir
    hosts: [claude, codex]
    purpose: 视频字幕与研究：提取本地/URL 音视频逐字稿、字幕、关键帧和研究素材；完整文章由 source-longform-writing 编排，平台标题交 content-package-create
    uses_engines: [video-research]
  - name: video-clip
    media_domain: production
    layer: L2
    source: skills/video-clip
    install_kind: dir
    hosts: [claude, codex]
    purpose: 口播/长视频成片统一工作流：经 video-compose 编排转录→选题脚本→人工确认→剪辑/字幕/铸造/组装；支持 PPT 风格、原视频快剪和按需叠加，统一执行输出路由与质量门
    uses_engines: [video-compose, video-select, video-slicer, video-framework-render, video-clip]
  - name: content-creator-research
    media_domain: research
    layer: L2
    source: skills/content-creator-research
    install_kind: dir
    hosts: [claude, codex]
    purpose: 自媒体人前期对标剖析综合工作流，四大子能力（teardown 博主拆解 / benchmark 博主对比 / niche-mapping 赛道测绘 / hook-decoding 钩子解码），带 fixture 与 checklist。产出止于结构化报告，不做物料包装。
    uses_engines: [xiaohongshu]
  - name: deep-research
    layer: L2
    source: vendor/deep-research/SKILL.md
    install_kind: file
    external: true
    purpose: 多源研究、证据持久化、引用跟踪报告
  - name: source-longform-writing
    media_domain: production
    layer: L2
    source: skills/source-longform-writing
    install_kind: dir
    hosts: [claude, codex]
    purpose: 文章写作：把 YouTube、播客、访谈、网页、官方文档、论文或混合资料写成中文长文；只有链接也从本入口开始，衔接资料获取、方向确认、完整文章、必要配图与表达润色
  - name: tencent-meeting-mcp
    layer: L2
    source: skills/tencent-meeting-mcp
    install_kind: dir
    purpose: 腾讯会议管理、参会人查询、录制/转写/智能纪要查询的官方 MCP skill；内容抓取场景仍优先走 platform-fetch 的腾讯会议 reference

