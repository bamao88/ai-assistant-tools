engines:
  - id: xiaohongshu
    path: engines/xiaohongshu
    runtime: "python (.venv) — scripts/cli.py"
    purpose: 小红书登录/搜索/发布/互动/图文视频长文自动化
  - id: gzh-publish
    path: engines/gzh-publish
    runtime: "node/tsx — src/index.ts"
    purpose: 微信公众号 Markdown 排版、草稿、发布（历史目录名 gzh_pubulish 已修正）
  - id: tencent-video-publish
    path: engines/tencent-video-publish
    runtime: "python (.venv) — scripts/cli.py"
    purpose: 微信视频号扫码登录、视频上传、保存草稿、正式/定时发表
  - id: wechat-channels-fetch
    path: engines/wechat-channels-fetch
    runtime: "python (复用 tencent-video-publish .venv) — scripts/cli.py"
    purpose: 微信视频号公开账号搜索、博主作品列表分页抓取、作品详情与评论列表；复用视频号发布账号 storage_state，也可调用 wx_channel 兼容本地 HTTP API
  - id: gzh-scraper
    path: engines/gzh-scraper
    runtime: "python — scripts/cli.py + wechat-article-exporter 服务"
    purpose: 微信公众号搜索/文章列表/下载/监控
  - id: markdown-to-cards
    path: engines/markdown-to-cards
    runtime: "node — cli.js"
    purpose: Markdown 转小红书卡片图片
  - id: video-research
    path: engines/video-research
    runtime: "python (.venv) — scripts/cli.py"
    purpose: 视频字幕/关键帧/元数据/研究摘要
  - id: video-select
    path: engines/video-select
    runtime: "python — video_select 包（单向 import video-slicer 句/时间核心）"
    purpose: "第②环·选片 Eval Harness + 成片脚本：Runner(topics 选题 / generate 候选=总编→组装→字级去口水决策→钩子) + gates(精选合并/无重叠/正文≥60s/可执行/零编造门禁) + score(候选 vs 冻结 golden 逼近度) + select_clips_a(方案A备用对照)；4 条提示词全在 prompts/(topic-select/body-edit/refine-deduct/hook·按功能命名·无人设/账号)；Harness 数据 eval/(fixtures 入库·golden 冻结参照随迭代升版 / runs 不入库 / words 软链 / notes 经验)；capabilities.json 声明(stage=select)。定「剪成什么」不定「怎么剪」。无独立触发 skill"
  - id: video-slicer
    path: engines/video-slicer
    runtime: "python — video_slicer 包"
    purpose: "积木厂·剪辑策略原子：cut_sentence(句级·线上)/cut_word(词级·方案B twostage) 共存 + 内容决策 pages_gen/srt_fix + transcribe(字级转写·火山主/阿里兜底) + segment(静音分句) + script_clean(字级去口水) + cut_video(切片) + run_cut(字级线端到端) + ④承重墙 subtitle_align(读剪辑账本搬字幕时间·remap_time 重放)/subtitle_protect(别动清单钉回+结构自检)；定制层 personas/zh_main.md + profiles/zh_main/{...,keeplist.json} + references/字级去口水与承接句保护.md；capabilities.json 声明(带六环 stage 标签)。无独立触发 skill"
  - id: video-clip
    path: engines/video-clip
    runtime: "python (.venv: pillow+opencv) — atoms/*.py（ffmpeg；endcard 渲 html 卡需 node/puppeteer；首次跑 requirements.txt）"
    purpose: "积木厂·叠加/裁剪/自检原子库：通用叠加(拼接/进度条/片尾/变速/字幕/封面/标题/人脸/遮名) + ③裁剪承重墙(rough_cut 3a切段拼身子/trim_silence 3c去长静音吐区间/speed_adapt 3d固定档换轨) + 源适配(reframe_crop 裁外框/name_mask --black 多块挡UI/denoise_voice demucs可选) + 自检门(align_check 门A切点+门D字幕对齐/len_check 身子时长) + _manifest.py(剪辑账本读写+remap_time 重放·承重墙数据模型)；capabilities.json 声明(带六环 stage 标签)；总能力表+配方在 video-compose；回归测试 test_atoms.sh"
  - id: video-framework-render
    path: engines/video-framework-render
    runtime: "python (独立 .venv: pillow+opencv-python-headless) — video_framework_render.render 模块（ffmpeg+libass；node puppeteer 经 PUPPETEER_PATH；字体 Hannotate/PingFang SC）"
    purpose: "积木厂·改造/渲染原子：手写框架页翻页+人像圆形PIP+纠错字幕+自适应变速成片(framework_reframe/compose/accelerate/subtitles/reframe_locate/raw)；竖版(720×1280 框架页)/横版(1280×720 方框)/裁剪版(1080×1920 clip_cut=vertical×1.5)同源，几何外置 layouts/{vertical,landscape,clip_cut}.json(--layout 选)；药丸渲染 make_subtitles 经 subtitles_cli 暴露给裁剪版⑤复用(不改渲染逻辑·G4 零回归)；账号 fixes.json 在 profiles/zh_main/；capabilities.json 声明"
  - id: video-compose
    path: engines/video-compose
    runtime: "python — selector.py/run.py/build_catalog.py（无重依赖；调度各引擎）"
    purpose: "组合层（薄·唯一对外入口，只指挥不产原子）：catalog.json(跨引擎汇总31原子·带六环 stage 标签) + recipes.json(zh_business PPT版/zh_clip_cut 裁剪版真chain/landscape_business 横版/raw_quickcut…) + selector(选配方·按六环分组) + run(跨引擎编排·真chain 委派 clip_cut_run.py) + clip_cut_run.py(裁剪版链式执行器·剪辑账本流转)；依赖单向 compose→各引擎。六环主链=转写→选片→裁剪→字幕→铸造→组装；架构主轴 §3.4/D7"
  - id: tencent-meeting
    path: engines/tencent-meeting
    runtime: "python — scripts/mcp_cli.py（官方 MCP 桥接；legacy 下载脚本保留）"
    purpose: 腾讯会议官方 MCP 录制/转写/智能纪要查询（由 platform-fetch 调用）
  - id: screenshot
    path: engines/screenshot
    runtime: "node — screenshot.js (+ export_cookies.py)"
    purpose: 网页截图；凭证读 var/state
  - id: route-bypass
    path: engines/route-bypass
    runtime: "zsh — scripts/xhs-route-bypass.zsh"
    purpose: 本地网络分流工具（转录链路与历史诊断使用）
  - id: platform-draft-direct
    path: engines/platform-draft-direct
    runtime: "node — src/cli.js"
    purpose: 知乎/掘金/CSDN/百家号/51CTO/博客园/思否/开源中国/B站专栏/搜狐号无 Chrome 插件草稿直传；凭证落 var/credentials/platform-draft-direct
  - id: calendar-task
    path: engines/calendar-task
    runtime: "sh — calendar-task.sh"
    purpose: Apple 日历提醒脚本
  - id: customer-management
    path: engines/customer-management
    runtime: "python — `cd engines && python3 -m customer-management <cmd>`（或 engine 根 `python3 __main__.py <cmd>`）；数据经 config.py 锚 assistant_zh（CUSTOMER_MGMT_DATA_ROOT 可覆盖）"
    purpose: "客户管理引擎：9 命令 gather/intake/employment/friends-sync/group-order/payment/health-check/read-chat/search-chat；4 能力 acquire/recognize/analyze(任务卡 cards/)/resolve + write_policy + recipes。被 scope:assistant_zh 的 customer-management skill 调用，业务数据留 assistant_zh"

vendor:
  - id: wechatsync
    path: vendor/wechatsync
    upstream: https://github.com/wechatsync/Wechatsync
    purpose: 多平台文章同步（知乎/掘金/CSDN/头条/B站/百家号/搜狐号/简书/博客园/抖音图文）；含 MCP server，被 platform-publish 调用
  - id: humanizer
    path: vendor/humanizer
    upstream: https://github.com/blader/humanizer
    purpose: 去 AI 味写作 skill（外部 clone，暴露 humanizer skill）
  - id: deep-research
    path: vendor/deep-research
    upstream: https://github.com/199-biotechnologies/claude-deep-research-skill
    purpose: 多源研报 skill（外部 clone，暴露 deep-research skill）
  - id: dbskill
    path: vendor/dbskill
    upstream: https://github.com/dontbesilent2025/dbskill
    purpose: dontbesilent 商业诊断工具箱，暴露 dbs-* 系列 skills
  - id: wechat-article-exporter
    path: vendor/wechat-article-exporter
    purpose: gzh-scraper 依赖的公众号文章导出服务（外部代码）
  - id: social-auto-upload
    path: vendor/social-auto-upload
    upstream: https://github.com/dreammis/social-auto-upload
    purpose: 多平台视频发布（B站视频投稿封装 biliup / 抖音浏览器自动化）；经 platform-publish 的 references/bilibili-video.md 与 references/douyin.md 调用，仅用其 sau CLI，不暴露自带 skill。凭证落 var/state/social-auto-upload/cookies

var:
  description: 运行时目录，全部 gitignore，永不放代码
  subdirs:
    state: 凭证与登录态（accounts.json, storage_state.json, *.runtime）
    output: 生成产物（卡片图等，CLI 用 --output-dir 指向）
    data: 抓取/下载数据
    logs: 日志
    drafts: 临时草稿与实验（含 ai_topic_scout）
    review: 评审文档与 _deprecated 归档（含 content_research_hub）
    _migration_backup: 重构期备份

