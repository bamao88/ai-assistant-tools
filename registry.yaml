# Single source of truth for the shared tools directory.
# Four-tier layout:
#   skills/  - first-party triggerable skills (each a dir with SKILL.md).
#   engines/ - code / CLIs called by skills. NOT triggerable on their own.
#   vendor/  - external clones (own upstream git); some expose a skill.
#   var/     - runtime: state, output, data, logs, drafts, review (gitignored).
#
# Skills are installed into ~/.claude/skills as symlinks (see scripts/sync-skills.py).
# Nothing under skills/ holds heavy code; nothing under engines/ triggers directly.
#
# install_kind:
#   dir  -> symlink ~/.claude/skills/<name> -> <source dir>
#   file -> symlink ~/.claude/skills/<name>/SKILL.md -> <source SKILL.md> (for vendor clones)

skills:
  # --- L1 verb routers (cross-platform entry points) ---
  - name: platform-fetch
    layer: L1
    source: skills/platform-fetch
    install_kind: dir
    purpose: 封闭平台内容抓取统一入口（小红书 / 公众号 / 腾讯会议 / 视频字幕封面关键帧）
    uses_engines: [xiaohongshu, gzh-scraper, tencent-meeting, video-research]
  - name: platform-publish
    layer: L1
    source: skills/platform-publish
    install_kind: dir
    purpose: 内容发布与多平台分发统一入口（小红书 / 公众号 / 视频号 / B站视频 / 抖音视频 / wechatsync 全平台）
    uses_engines: [xiaohongshu, gzh-publish, tencent-video-publish, markdown-to-cards, route-bypass]
    uses_vendor: [wechatsync, social-auto-upload]

  # --- L2 workflows ---
  - name: blogger-research
    layer: L2
    source: skills/blogger-research
    install_kind: dir
    purpose: 博主调研：批量抓取博主公开内容 + 结构化分析报告
    uses_engines: [xiaohongshu, gzh-scraper]
  - name: xhs-ops
    layer: L2
    source: skills/xhs-ops
    install_kind: dir
    purpose: 小红书复合运营工作流（搜索+详情+发布+互动）
    uses_engines: [xiaohongshu]
  - name: video-content
    layer: L2
    source: skills/video-content
    install_kind: dir
    purpose: 视频内容处理（本地/URL 逐字稿、字幕、关键帧、素材研究、标题备选）
    uses_engines: [video-research]
  - name: creator-profile
    layer: L2
    source: skills/creator-profile
    install_kind: dir
    purpose: 自媒体人前期对标剖析综合工作流，四大子能力（teardown 博主拆解 / benchmark 博主对比 / niche-mapping 赛道测绘 / hook-decoding 钩子解码），带 fixture 与 checklist。产出止于结构化报告，不做物料包装。
    uses_engines: [xiaohongshu]
  - name: deep-research
    layer: L2
    source: vendor/deep-research/SKILL.md
    install_kind: file
    external: true
    purpose: 多源研究、证据持久化、引用跟踪报告

  # --- atomic / utility ---
  - name: xhs-auth
    layer: atomic
    source: skills/xhs-auth
    install_kind: dir
    purpose: 小红书登录 / 登录态检查 / 多账号管理
    uses_engines: [xiaohongshu]
  - name: xhs-interact
    layer: atomic
    source: skills/xhs-interact
    install_kind: dir
    purpose: 小红书评论 / 回复 / 点赞 / 收藏
    uses_engines: [xiaohongshu]
  - name: markdown-to-cards
    layer: util
    source: skills/markdown-to-cards
    install_kind: dir
    purpose: Markdown 转小红书风格卡片图片
    uses_engines: [markdown-to-cards]
  - name: find-images
    layer: util
    source: skills/find-images
    install_kind: dir
    purpose: 为文章寻找合适配图，支持直接截图和登录墙场景下的网络搜索提取
    uses_engines: [screenshot]
  - name: humanizer
    layer: util
    source: vendor/humanizer/SKILL.md
    install_kind: file
    external: true
    purpose: 去 AI 味写作润色
  - name: dbs
    layer: external
    source: vendor/dbskill/skills/dbs
    install_kind: dir
    external: true
    purpose: dontbesilent 商业工具箱主入口，按意图路由到 dbs-* skills
    uses_vendor: [dbskill]
  - name: dbs-diagnosis
    layer: external
    source: vendor/dbskill/skills/dbs-diagnosis
    install_kind: dir
    external: true
    purpose: 商业模式诊断，消解问题优先于回答问题
