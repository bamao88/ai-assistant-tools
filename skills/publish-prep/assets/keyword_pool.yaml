_doc: |
  发布前关键词池 · 共享单一真源（从 workflow/video_framework_slicer/keywords_pool.json 提升）。
  确定性构造，不调模型。三层优先级：trending(热词监控预留) > topical(正文命中正则) > fixed(固定盘) → fill_pool 补满。
  消费：build_keywords.py（Phase2 改指本文件）。数量按平台取 fill_to_by_platform；正则匹配用小写。
_pivot_todo: |
  fixed 仍偏「AI 产品经理」旧口径。2026-06-29 主号转向企业AI落地后，fixed/topical 的权重应逐步向
  「企业ai落地/agent工程/ai落地」倾斜——涉及真实发文关键词输出，留用户过一遍再深调；本次只做机制
  （fill_to 参数化 + 共享位置）+ 补一条 topical「企业ai落地」（已在 d2c 实际用过）。

# 每平台补满到几个（对齐 platform_rules.yaml 的 keywords.count）
fill_to_by_platform:
  xiaohongshu: 10
  shipinhao: 5
  douyin: 5
  bilibili: 10
  default: 10

fixed: [ai, ai产品经理, ai转型, aipm, 大模型]

topical:
  "claude code|claudecode|claude": [claudecode, aicoding]
  "codex": [codex, aicoding]
  "agent sdk|agent": [agent]
  "求职|面试|跳槽|背锅": [求职, 面试]
  "设计师|设计": [设计师, 转行]
  "prompt|claude.md|memory|hook": [prompt]
  "测试|自动化|browser use|computer use": [自动化测试]
  "创业|公司|pmf": [创业]
  "vibe coding|vibecoding": [vibecoding]
  "售前|项目经理|解决方案": [职场]
  "demo|从0到1|立项|调研": [产品经理]
  "企业|落地|数字员工|降本|咨询|toB|to b": [企业ai落地]   # pivot 后补（d2c 已实际使用）

trending: []
_trending_note: 预留扩展点；未来「小红书热词监控」把当下高流量词写入此数组，构造器以最高优先级采纳（挤掉 fill 通用词）。

fill_pool: [人工智能, aicoding, 程序员, 职场, ai应用, 产品经理, 互联网, 普通人逆袭]
